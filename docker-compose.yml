version: '3.8'

services:
  travel-planner-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-planner-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/travel_planner.db
      - ART_INSTITUTE_API_BASE_URL=https://api.artic.edu/api/v1
      - API_CACHE_TTL_SECONDS=3600
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
